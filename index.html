<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏸 羽球分隊系統</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f4f4f4;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input{
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    background:#0d6efd;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

.player{
    display:inline-block;
    padding:8px 12px;
    margin:5px;
    background:#dbeafe;
    border-radius:20px;
}

.delete-btn{
    margin-left:5px;
    background:none;
    color:red;
}

.court-card{
    background:white;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.badminton-court{
    position:relative;
    background:#1f8f50;
    height:350px;
    border-radius:10px;
}

.outer-line{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    bottom:20px;
    border:3px solid #fff;
}

.net-line{
    position:absolute;
    left:50%;
    height:100%;
    border-left:4px dashed #fff;
}

.left-team,
.right-team{
    position:absolute;
    width:50%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:center;
    color:white;
    font-size:28px;
    font-weight:bold;
}

.left-team{
    left:0;
}

.right-team{
    right:0;
}

@media(max-width:768px){

    .badminton-court{
        height:240px;
    }

    .left-team,
    .right-team{
        font-size:18px;
    }

}

</style>
</head>

<body>

<h1>🏸 羽球分隊系統 V3</h1>

<div class="card">

    場地數量：

    <input
        type="number"
        id="courtCount"
        value="1"
        min="1">

</div>

<div class="card">

    <h3>新增球員</h3>

    <input
        type="text"
        id="playerName"
        placeholder="輸入姓名">

    <button onclick="addPlayer()">
        加入
    </button>

    <button onclick="clearPlayers()">
        清空名單
    </button>

</div>

<div class="card">

    <h3>報名名單</h3>

    <div id="playerList"></div>

</div>

<div class="card">

    <button onclick="generateTeams()">
        🎲 開始分隊
    </button>

</div>

<div id="result"></div>

<script>

let players = [];

let lastBenchPlayers = [];

function addPlayer(){

    const name =
        document.getElementById("playerName")
        .value
        .trim();

    if(!name){
        alert("請輸入姓名");
        return;
    }

    if(players.includes(name)){
        alert("姓名已存在");
        return;
    }

    players.push(name);

    document.getElementById("playerName").value="";

    renderPlayers();
}

function removePlayer(index){

    players.splice(index,1);

    renderPlayers();
}

function clearPlayers(){

    players=[];

    lastBenchPlayers=[];

    renderPlayers();

    document.getElementById("result").innerHTML="";
}

function renderPlayers(){

    let html="";

    players.forEach((player,index)=>{

        html += `
        <span class="player">
            ${player}
            <button
            class="delete-btn"
            onclick="removePlayer(${index})">
            ❌
            </button>
        </span>
        `;
    });

    document.getElementById("playerList").innerHTML=
        html;
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [array[i],array[j]] =
        [array[j],array[i]];
    }

    return array;
}

function generateTeams(){

    const courtCount =
        parseInt(
            document.getElementById("courtCount").value
        );

    const required =
        courtCount * 4;

    if(players.length < required){

        alert(
            `至少需要 ${required} 位球員`
        );

        return;
    }

    let playingPlayers=[];
    let benchPlayers=[];

    if(players.length === required){

        playingPlayers=[...players];

        shuffle(playingPlayers);

        lastBenchPlayers=[];

    }
    else{

        const priorityPlayers =
            lastBenchPlayers.filter(
                p=>players.includes(p)
            );

        const others =
            players.filter(
                p=>!priorityPlayers.includes(p)
            );

        shuffle(others);

        const ordered=[
            ...priorityPlayers,
            ...others
        ];

        playingPlayers =
            ordered.slice(
                0,
                required
            );

        benchPlayers =
            ordered.slice(
                required
            );

        lastBenchPlayers =
            [...benchPlayers];
    }

    let html="";

    for(
        let court=1;
        court<=courtCount;
        court++
    ){

        const start =
            (court-1)*4;

        html += `

        <div class="court-card">

        <h2>🏸 第 ${court} 場</h2>

        <div class="badminton-court">

            <div class="outer-line"></div>

            <div class="net-line"></div>

            <div class="left-team">
                <div>${playingPlayers[start]}</div>
                <div>${playingPlayers[start+1]}</div>
            </div>

            <div class="right-team">
                <div>${playingPlayers[start+2]}</div>
                <div>${playingPlayers[start+3]}</div>
            </div>

        </div>

        </div>
        `;
    }

    if(benchPlayers.length>0){

        html += `
        <div class="court-card">

            <h2>
                🪑 本輪候補 (${benchPlayers.length}人)
            </h2>

            <div style="
                text-align:center;
                font-size:24px;
                font-weight:bold;
                color:#dc3545;
            ">

            ${benchPlayers.join("<br>")}

            </div>

        </div>
        `;
    }

    document.getElementById("result").innerHTML =
        html;
}

document
.getElementById("playerName")
.addEventListener(
    "keypress",
    function(e){

        if(e.key==="Enter"){

            addPlayer();
        }
    }
);

</script>

</body>
</html>
